# config.yaml
n_trials: 20

# Each composition is a list aligned with selected_elements order
compositions:
  - [0.75, 0.25]

fix: true
selected_elements: ["Cu", "Pd"]

initialization:
  - alpha: 1.0

syntropization:
  - Tsallis_q: 2.0
  - type: "compacting" # options: "forcing", "compacting"
  - tau_init: 1.0 # recommend: 1.0 for type compacting, 1e-3 (or just something small) for type forcing
  - tau_mult: 0.9 # recommend: 0.9 for type compacting, 2 for type forcing
  - gamma: 1.0 # recommend: 1.0 for compacting, irrelevant for forcing

endmembers:
  - fractions: [1, 0]
    formation_energy_per_atom: 0.0
  - fractions: [0, 1]
    formation_energy_per_atom: 0.0

# Lattice vectors
lattice_vectors:
  - [3.665, 0.0,  0.0]
  - [0.0,  3.665, 0.0]
  - [0.0,  0.0, 3.665]

frac_coords_init:
  - ["mix",  0.000,  0.000,  0.000 ]
  - ["mix",  0.500,  0.500,  0.000 ]
  - ["mix",  0.500,  0.000,  0.500 ]
  - ["mix",  0.000,  0.500,  0.500 ]

supercell_size: [2, 2, 4]

# optional overrides (safe defaults if omitted)
outdir: "out"
hull_db_filename: "hull_db.json"
